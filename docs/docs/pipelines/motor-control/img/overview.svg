<svg class="diagram" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data flow: Gazebo sensors into the vehicle controller, which publishes the pose; the scenario player reads its simulated time and hands the setpoint pose down the pipe; the velocity stage adds the force, the resolver sets the attitude to reach, the attitude controller turns the setpoint into the wrench for the mixer; the mixer's commands go back to the vehicle controller and the actuators">
  <defs>
    <marker id="p-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="p-arw-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#4a90d9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="18" width="620" height="50" rx="6" fill="currentColor" fill-opacity="0.05" stroke="#cb8b1e" stroke-width="1.2"/>
  <text x="350" y="48" text-anchor="middle" font-size="12.5" font-weight="600">Gazebo Harmonic — sensors, actuators, physics</text>
  <line x1="100" y1="68" x2="100" y2="114" stroke="currentColor" stroke-width="1.3" marker-end="url(#p-arw)"/>
  <text x="92" y="96" text-anchor="end" font-size="10" opacity="0.8">sensors</text>
  <line x1="190" y1="116" x2="190" y2="72" stroke="currentColor" stroke-width="1.3" marker-end="url(#p-arw)"/>
  <text x="198" y="96" font-size="10" opacity="0.8">actuators</text>
  <line x1="575" y1="68" x2="575" y2="114" stroke="currentColor" stroke-width="1.3" marker-end="url(#p-arw)"/>
  <text x="585" y="96" font-size="10" opacity="0.8">motor feedback</text>
  <rect x="40" y="120" width="170" height="64" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#cb8b1e" stroke-width="1.2"/>
  <text x="125" y="146" text-anchor="middle" font-size="12" font-weight="600">OspraiController</text>
  <text x="125" y="166" text-anchor="middle" font-size="10" opacity="0.75">bridge, effort law</text>
  <rect x="265" y="120" width="170" height="64" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="350" y="146" text-anchor="middle" font-size="12" font-weight="600">AttitudeController</text>
  <text x="350" y="166" text-anchor="middle" font-size="10" opacity="0.75">geometric PD, [q⁻¹·f_d ; M]</text>
  <rect x="490" y="120" width="170" height="64" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#2aa198" stroke-width="1.2"/>
  <text x="575" y="146" text-anchor="middle" font-size="12" font-weight="600">MotorsMixer</text>
  <text x="575" y="166" text-anchor="middle" font-size="10" opacity="0.75">control allocation</text>
  <rect x="40" y="226" width="130" height="52" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#d4694a" stroke-width="1.2"/>
  <text x="105" y="248" text-anchor="middle" font-size="11" font-weight="600">ScenarioPlayer</text>
  <text x="105" y="266" text-anchor="middle" font-size="9.5" opacity="0.75">q_pref, v_d</text>
  <rect x="205" y="226" width="130" height="52" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#8b7cd8" stroke-width="1.2"/>
  <text x="270" y="248" text-anchor="middle" font-size="11" font-weight="600">VelocityController</text>
  <text x="270" y="266" text-anchor="middle" font-size="9.5" opacity="0.75">+ f_d (a_d = 0)</text>
  <rect x="370" y="226" width="130" height="52" rx="6" fill="currentColor" fill-opacity="0.06" stroke="#8b7cd8" stroke-width="1.2"/>
  <text x="435" y="248" text-anchor="middle" font-size="11" font-weight="600">Resolver</text>
  <text x="435" y="266" text-anchor="middle" font-size="9.5" opacity="0.75">q_d, ω_d (stub)</text>
  <line x1="210" y1="146" x2="259" y2="146" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#p-arw)"/>
  <text x="234" y="136" text-anchor="middle" font-size="9.5" opacity="0.8">Pose</text>
  <line x1="435" y1="146" x2="484" y2="146" stroke="#4a90d9" stroke-width="1.7" marker-end="url(#p-arw-b)"/>
  <text x="459" y="136" text-anchor="middle" font-size="9.5" fill="#4a90d9">wrench</text>
  <line x1="105" y1="184" x2="105" y2="220" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#p-arw)"/>
  <text x="113" y="206" font-size="9.5" opacity="0.75">Pose (time)</text>
  <line x1="170" y1="252" x2="199" y2="252" stroke="#4a90d9" stroke-width="1.7" marker-end="url(#p-arw-b)"/>
  <line x1="335" y1="252" x2="364" y2="252" stroke="#4a90d9" stroke-width="1.7" marker-end="url(#p-arw-b)"/>
  <line x1="420" y1="226" x2="420" y2="190" stroke="#4a90d9" stroke-width="1.7" marker-end="url(#p-arw-b)"/>
  <text x="428" y="212" font-size="9.5" fill="#4a90d9">setpoint Pose</text>
  <text x="270" y="296" text-anchor="middle" font-size="9.5" fill="#4a90d9">one setpoint Pose down the pipe, enriched stage after stage</text>
  <path d="M660 152 L684 152 L684 312 L20 312 L20 152 L34 152" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#p-arw)"/>
  <text x="350" y="334" text-anchor="middle" font-size="10" opacity="0.75">command channel — motor efforts, applied on the next pass</text>
</svg>
